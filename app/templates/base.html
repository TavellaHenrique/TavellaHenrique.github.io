<!DOCTYPE html>
<html lang="{{ content.language }}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Henrique Tavella — Developer Portfolio">
    <meta name="author" content="Henrique Ribeiro da Cunha Tavella">

    <title>Henrique Tavella | Portfolio</title>

    <!-- Load the portfolio typography from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="#home" aria-label="Henrique Tavella - Home">
            Allevat<span>.</span>
        </a>

        <nav class="main-navigation" aria-label="Main navigation">
            <a href="#home">{{ content.navigation.home }}</a>
            <a href="#projects">{{ content.navigation.projects }}</a>
            <a href="#skills">{{ content.navigation.skills }}</a>
            <a href="#about">{{ content.navigation.about }}</a>
            <a href="#contact">{{ content.navigation.contact }}</a>
        </nav>

        <div class="header-controls">
            <a
                class="language-toggle"
                href="{{ url_for(content.language_toggle_endpoint) }}"
            >
                {{ content.alternate_language }}
            </a>

            <button
                class="theme-toggle"
                type="button"
                aria-label="Toggle color theme"
                aria-pressed="false"
            >
                <span aria-hidden="true">◐</span>
            </button>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>{{ content.footer }}</p>
        <span>© {{ 2026 }} Henrique Tavella</span>
    </footer>
</body>
</html>
