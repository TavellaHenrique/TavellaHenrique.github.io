<!DOCTYPE html>
<html lang="{{ content.language }}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="{{ content.site.description }}">
    <meta name="author" content="{{ content.site.author }}">

    <title>{{ content.site.title }}</title>

    <!-- Load the portfolio typography from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="#home" aria-label="{{ content.accessibility.home_link }}">
            {{ content.site.brand }}
        </a>

        <nav class="main-navigation" aria-label="{{ content.accessibility.main_navigation }}">
            <a href="#home">{{ content.navigation.home }}</a>
            <a href="#projects">{{ content.navigation.projects }}</a>
            <a href="#skills">{{ content.navigation.skills }}</a>
            <a href="#contact">{{ content.navigation.contact }}</a>
        </nav>

        <div class="header-controls">
            <div class="language-picker" data-current-language="{{ content.language }}">
                <button
                    class="language-toggle"
                    type="button"
                    aria-label="{{ content.accessibility.language_selector }}"
                    aria-haspopup="listbox"
                    aria-expanded="false"
                    aria-controls="language-options"
                >
                    <span class="language-toggle-label" aria-live="polite">
                        {{ "PT-BR" if content.language == "pt-BR" else "EN" }}
                    </span>
                    <svg
                        class="language-toggle-chevron"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <path d="M6 9.5 12 15.5 18 9.5" />
                    </svg>
                </button>

                <ul
                    class="language-menu"
                    id="language-options"
                    role="listbox"
                    aria-label="{{ content.accessibility.language_selector }}"
                >
                    <li>
                        <button
                            class="language-option {% if content.language == 'pt-BR' %}is-selected{% endif %}"
                            type="button"
                            role="option"
                            aria-selected="{{ 'true' if content.language == 'pt-BR' else 'false' }}"
                            data-lang="pt-br"
                            data-value="PT-BR"
                            data-url="{{ url_for('main.index_pt_br') }}"
                        >
                            <span class="language-option-code">PT-BR</span>
                            <span class="language-option-label">Português (Brasil)</span>
                        </button>
                    </li>
                    <li>
                        <button
                            class="language-option {% if content.language != 'pt-BR' %}is-selected{% endif %}"
                            type="button"
                            role="option"
                            aria-selected="{{ 'true' if content.language != 'pt-BR' else 'false' }}"
                            data-lang="en"
                            data-value="EN"
                            data-url="{{ url_for('main.index') }}"
                        >
                            <span class="language-option-code">EN</span>
                            <span class="language-option-label">English</span>
                        </button>
                    </li>
                </ul>
            </div>

            <button
                class="theme-toggle"
                type="button"
                aria-label="{{ content.accessibility.theme_toggle }}"
                aria-pressed="false"
            >
                <span aria-hidden="true">◐</span>
            </button>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>{{ content.footer.copyright.format(year=content.footer.year) }}</p>
        <p class="logo">{{ content.contact.signature }}</p>
    </footer>
</body>
</html>
