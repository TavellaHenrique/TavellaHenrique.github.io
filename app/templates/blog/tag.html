{% extends "base.html" %}

{% block content %}
<section class="blog-tag-page section-container" aria-labelledby="tag-title">
    <a
        class="blog-tag-back-link"
        href="{{ url_for('main.blog') if content.language == 'en' else url_for('main.blog_pt_br') }}"
    >
        <span aria-hidden="true">←</span>
        {{ site_text.blog.back_to_blog }}
    </a>

    <header class="blog-tag-header">
        <h1 id="tag-title">
            {{ site_text.blog.tag_heading }}: {{ tag }}
        </h1>

        <p>{{ site_text.blog.tag_intro }}</p>
    </header>

    {% include "blog/_post_cards.html" %}
</section>
{% endblock %}
